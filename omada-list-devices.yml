---
# Omada Open API — READ-ONLY: list APs + per-device firmware availability.
# Endpoint confirmed from a working reference implementation:
#   GET /openapi/v1/{omada_id}/sites/{site_id}/devices/{mac}/latest-firmware-info
# Credentials injected by AAP from the "Omada Open API" credential.
- name: Omada — list APs and check firmware availability (read-only)
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    omada_validate_certs: false      # OC200 self-signed cert (lab setting)
    omada_site_name: "Shadybank"

  tasks:
    - name: Preflight — ensure the Omada credential is attached
      ansible.builtin.assert:
        that:
          - omada_base_url is defined
          - omada_id is defined
          - omada_client_id is defined
          - omada_client_secret is defined
        fail_msg: "Omada API variables missing — attach the 'Omada Open API' credential to this Job Template."

    - name: Request an Open API access token (client-credentials grant)
      ansible.builtin.uri:
        url: "{{ omada_base_url }}/openapi/authorize/token?grant_type=client_credentials"
        method: POST
        body_format: json
        body:
          omadacId: "{{ omada_id }}"
          client_id: "{{ omada_client_id }}"
          client_secret: "{{ omada_client_secret }}"
        validate_certs: "{{ omada_validate_certs }}"
        timeout: 20
        return_content: true
      register: omada_token_resp

    - name: Fail clearly if authentication returned an API error
      ansible.builtin.assert:
        that: omada_token_resp.json.errorCode == 0
        fail_msg: "Auth failed — errorCode={{ omada_token_resp.json.errorCode }}: {{ omada_token_resp.json.msg | default('') }}"

    - name: Save the access token
      ansible.builtin.set_fact:
        omada_token: "{{ omada_token_resp.json.result.accessToken }}"

    - name: List sites (paginated)
      ansible.builtin.uri:
        url: "{{ omada_base_url }}/openapi/v1/{{ omada_id }}/sites?page=1&pageSize=100"
        method: GET
        headers:
          Authorization: "AccessToken={{ omada_token }}"
        validate_certs: "{{ omada_validate_certs }}"
        timeout: 20
        return_content: true
      register: omada_sites_resp

    - name: Resolve the site id for "{{ omada_site_name }}"
      ansible.builtin.set_fact:
        omada_site_id: "{{ omada_sites_resp.json.result.data | selectattr('name', 'equalto', omada_site_name) | map(attribute='siteId') | first }}"

    - name: List devices in the site (page + pageSize required)
      ansible.builtin.uri:
        url: "{{ omada_base_url }}/openapi/v1/{{ omada_id }}/sites/{{ omada_site_id }}/devices?page=1&pageSize=100"
        method: GET
        headers:
          Authorization: "AccessToken={{ omada_token }}"
        validate_certs: "{{ omada_validate_certs }}"
        timeout: 20
        return_content: true
      register: omada_devices_resp

    - name: Get latest firmware info per device
      ansible.builtin.uri:
        url: "{{ omada_base_url }}/openapi/v1/{{ omada_id }}/sites/{{ omada_site_id }}/devices/{{ item.mac }}/latest-firmware-info"
        method: GET
        headers:
          Authorization: "AccessToken={{ omada_token }}"
        validate_certs: "{{ omada_validate_certs }}"
        timeout: 20
        return_content: true
      register: omada_fw
      failed_when: false
      loop: "{{ omada_devices_resp.json.result.data }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Show device + raw firmware-info (reveals the real fields)
      ansible.builtin.debug:
        msg: >-
          {{ item.item.name }} ({{ item.item.model }}) current={{ item.item.firmwareVersion }}
          | apiErr={{ item.json.errorCode | default('?') }}
          | firmwareInfo={{ item.json.result | default('n/a') }}
      loop: "{{ omada_fw.results }}"
      loop_control:
        label: "{{ item.item.name }}"
