---
# Omada Open API — READ-ONLY: authenticate, list the site, list + report APs.
# Credentials are injected by AAP from the "Omada Open API" credential:
#   omada_base_url, omada_id, omada_client_id, omada_client_secret
- name: Omada — list access points (read-only)
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    omada_validate_certs: false      # OC200 uses a self-signed cert (lab setting)
    omada_site_name: "Shadybank"

  tasks:
    - name: Preflight — ensure the Omada credential is attached
      ansible.builtin.assert:
        that:
          - omada_base_url is defined
          - omada_id is defined
          - omada_client_id is defined
          - omada_client_secret is defined
        fail_msg: "Omada API variables are missing — attach the 'Omada Open API' credential to this Job Template."

    - name: Request an Open API access token (client-credentials grant)
      ansible.builtin.uri:
        url: "{{ omada_base_url }}/openapi/authorize/token?grant_type=client_credentials"
        method: POST
        body_format: json
        body:
          omadacId: "{{ omada_id }}"
          client_id: "{{ omada_client_id }}"
          client_secret: "{{ omada_client_secret }}"
        validate_certs: "{{ omada_validate_certs }}"
        timeout: 20
        return_content: true
      register: omada_token_resp

    - name: Fail clearly if authentication returned an API error
      ansible.builtin.assert:
        that: omada_token_resp.json.errorCode == 0
        fail_msg: "Auth failed — errorCode={{ omada_token_resp.json.errorCode }}: {{ omada_token_resp.json.msg | default('') }}"

    - name: Save the access token
      ansible.builtin.set_fact:
        omada_token: "{{ omada_token_resp.json.result.accessToken }}"

    - name: List sites (paginated)
      ansible.builtin.uri:
        url: "{{ omada_base_url }}/openapi/v1/{{ omada_id }}/sites?page=1&pageSize=100"
        method: GET
        headers:
          Authorization: "AccessToken={{ omada_token }}"
        validate_certs: "{{ omada_validate_certs }}"
        timeout: 20
        return_content: true
      register: omada_sites_resp

    - name: Resolve the site id for "{{ omada_site_name }}"
      ansible.builtin.set_fact:
        omada_site_id: "{{ omada_sites_resp.json.result.data | selectattr('name', 'equalto', omada_site_name) | map(attribute='siteId') | first }}"

    - name: List devices in the site (page + pageSize are REQUIRED)
      ansible.builtin.uri:
        url: "{{ omada_base_url }}/openapi/v1/{{ omada_id }}/sites/{{ omada_site_id }}/devices?page=1&pageSize=100"
        method: GET
        headers:
          Authorization: "AccessToken={{ omada_token }}"
        validate_certs: "{{ omada_validate_certs }}"
        timeout: 20
        return_content: true
      register: omada_devices_resp

    - name: Show the raw DEVICES response (confirms the real field names)
      ansible.builtin.debug:
        var: omada_devices_resp.json

    - name: Validate the API's own errorCode (HTTP 200 is not enough!)
      ansible.builtin.assert:
        that: omada_devices_resp.json.errorCode == 0
        fail_msg: "Omada API error {{ omada_devices_resp.json.errorCode }}: {{ omada_devices_resp.json.msg }}"
        success_msg: "Devices retrieved."

    - name: Per-AP summary (fields default to '?' if named differently)
      ansible.builtin.debug:
        msg: "{{ item.name | default('?') }} | model={{ item.model | default('?') }} | ip={{ item.ip | default('?') }} | fw={{ item.version | default(item.firmwareVersion) | default('?') }} | status={{ item.status | default('?') }} | needUpgrade={{ item.needUpgrade | default('?') }}"
      loop: "{{ omada_devices_resp.json.result.data | default([]) }}"
      loop_control:
        label: "{{ item.name | default('?') }}"
